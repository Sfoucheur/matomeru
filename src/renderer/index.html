<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tight CSP: no remote scripts, and images limited to our own cache protocol
      plus data URIs. Card art is served by the main process over matomeru://.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' matomeru: data: blob:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Matomeru</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
