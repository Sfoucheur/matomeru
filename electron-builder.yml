appId: com.sebas.matomeru
productName: Matomeru
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/.vite/**'
asarUnpack:
  # node-sqlite3-wasm loads its .wasm from disk at runtime; it cannot live inside the asar.
  - '**/node_modules/node-sqlite3-wasm/**'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Matomeru
  # No blockmap. It exists only to let an auto-updater fetch a differential
  # download from an update feed, and this app ships no updater — nothing reads
  # it. Note this does NOT avoid the electron-builder 26.14+ breakage described
  # in README.md: that require() sits at the top of the module, so the import
  # throws whether or not the blockmap is ever built. The version pin is what
  # avoids it; this line just drops a file nothing uses.
  differentialPackage: false
